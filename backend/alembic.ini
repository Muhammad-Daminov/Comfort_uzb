[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# No DSN here on purpose — env.py reads DATABASE_URL from the environment
# so dev/prod (REQ-OPS-008: never share a DB) can't accidentally collide
# with a hardcoded connection string committed to the repo.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
