# Shared reverse-proxy settings for every /comfort.conf.template location
# that forwards to the FastAPI app. Installed alongside the site config as
# /etc/nginx/comfort_proxy.conf and pulled in via `include`.
#
# FastAPI/uvicorn is bound to 127.0.0.1:8001 only (§17.2) — never exposed
# directly to the public interface; Nginx is the only public entry point.
proxy_pass http://127.0.0.1:8001;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;

# API operations (order confirm, payment review) can legitimately take a
# few seconds under load — long enough to not cut off a slow-but-healthy
# request, short enough that a genuinely hung backend fails visibly rather
# than holding a client connection open indefinitely.
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
